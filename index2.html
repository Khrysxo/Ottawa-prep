<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0f17">
<link rel="apple-touch-icon" href="ottawa-icon.png"><link rel="icon" href="ottawa-icon.png"><link rel="manifest" href="ottawa.webmanifest"><meta name="apple-mobile-web-app-title" content="Ottawa Prep"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ottawa Prep for Call</title>
<style>:root{--bg:#0a0f17;--panel:#101826;--panel2:#152033;--line:#22314a;--text:#e7eef8;--mut:#93a4bb;--dim:#5f708a;
--acc:#f43f5e;--acc2:#fb7185;--cyan:#22d3ee;--amber:#fbbf24;--green:#34d399;--violet:#a78bfa;--red:#f87171;--blue:#60a5fa;
--r:14px;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2440 0%,transparent 60%),var(--bg);color:var(--text);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cyan)}b,strong{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}
/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:30;
background:rgba(10,15,23,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:38px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;white-space:nowrap;cursor:pointer}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#7c3aed);display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;margin-top:-3px}
.topstats{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12.5px;white-space:nowrap}
.chip b{font-weight:800}.chip.cd b{color:var(--acc2)}.chip.xp b{color:var(--amber)}.chip.st b{color:var(--green)}
/* layout */
.side{position:fixed;top:58px;bottom:0;left:0;width:280px;overflow:auto;padding:14px 10px 40px;border-right:1px solid var(--line);background:rgba(16,24,38,.7);z-index:20}
.main{margin-left:280px;padding:78px 28px 80px;max-width:1180px}
.sgrp{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin:16px 10px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--mut);font-size:14px}
.nav:hover{background:var(--panel2);color:var(--text)}.nav.on{background:linear-gradient(90deg,rgba(244,63,94,.18),rgba(244,63,94,.04));color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nav .num{width:22px;height:22px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:var(--mut)}
.nav .tick{margin-left:auto;color:var(--green);font-size:13px}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.suitebox{margin:2px 6px 8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,rgba(244,63,94,.12),rgba(124,58,237,.08))}
.suitebox .k{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}.suitebox .t{font-weight:800;line-height:1.25;margin-top:2px}
.suitebox select{margin-top:8px;width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px}
.scrim{display:none}
/* cards */
.h1{font-size:30px;line-height:1.15;font-weight:850;margin:0 0 6px;letter-spacing:-.4px}
.lead{color:var(--mut);font-size:16px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 16px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:17px}
.card ul{margin:0;padding-left:20px}.card li{margin:6px 0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;font-weight:650;font-size:14px}
.btn:hover{border-color:#36507a}.btn.p{background:linear-gradient(135deg,var(--acc),#e11d48);border-color:transparent;color:#fff}
.btn.c{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.4);color:#bdf4fb}.btn.s{padding:6px 10px;font-size:13px}
.btn.g{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4);color:#c9f7e6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:999px;background:rgba(244,63,94,.18);color:#fecdd3;vertical-align:middle}
.pill.dark{background:#0b0f17;color:#fff;border:1px solid var(--line)}.pill.red{background:var(--acc);color:#fff}
.pill.fy{background:rgba(52,211,153,.16);color:#a7f3d0}.pill.bd{background:rgba(167,139,250,.18);color:#ddd6fe}.pill.wk{background:rgba(34,211,238,.14);color:#a5f3fc}
.muted{color:var(--mut)}.small{font-size:13px}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:22px;border-radius:18px;
background:linear-gradient(135deg,rgba(244,63,94,.16),rgba(124,58,237,.12) 60%,rgba(34,211,238,.08));border:1px solid #33416a;margin-bottom:18px}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),#24324b 0)}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:28px}.ring span{font-size:11px;color:var(--mut)}
.stat{padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}.stat .v{font-size:24px;font-weight:850}.stat .l{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#1d2a40;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--violet))}
.tcard{cursor:pointer;transition:transform .12s,border-color .12s}.tcard:hover{transform:translateY(-2px);border-color:#3a5482}
.tcard .n{font-size:12px;color:var(--mut)}.tcard .tt{font-weight:800;line-height:1.3;margin:2px 0 6px}
/* topic */
.thead{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px}
.tnum{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#7c3aed);display:grid;place-items:center;font-size:22px;font-weight:900;flex:none;color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 18px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{background:none;border:0;padding:7px 12px;font-size:13px;color:var(--mut)}.seg button.on{background:var(--panel2);color:#fff}
.hook{font-size:19px;line-height:1.5;font-style:italic;padding:18px 22px;border-radius:var(--r);margin:0 0 16px;border:1px solid #3a2a40;
background:linear-gradient(135deg,rgba(244,63,94,.14),rgba(124,58,237,.06));color:#ffe4ea}
.blk-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.key{border-color:rgba(52,211,153,.45);background:linear-gradient(180deg,rgba(52,211,153,.09),var(--panel) 70%)}.key .blk-t{color:var(--green)}
.forget{border-color:rgba(251,191,36,.5);background:linear-gradient(180deg,rgba(251,191,36,.1),var(--panel) 70%)}.forget .blk-t{color:var(--amber)}
.red{border-color:rgba(248,113,113,.55);background:linear-gradient(180deg,rgba(239,68,68,.14),var(--panel) 70%)}.red .blk-t{color:var(--red)}
.ddx{border-color:rgba(167,139,250,.5);background:linear-gradient(180deg,rgba(167,139,250,.1),var(--panel) 70%)}.ddx .blk-t{color:var(--violet)}
.exam{border-color:rgba(96,165,250,.5);background:linear-gradient(180deg,rgba(96,165,250,.1),var(--panel) 70%)}.exam .blk-t{color:var(--blue)}
.report{border-color:rgba(34,211,238,.45)}.report .blk-t{color:var(--cyan)}
.beyond{border-style:dashed;background:rgba(16,24,38,.6)}.beyond .blk-t{color:var(--mut)}
.ddxrow{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.ddxrow:first-of-type{border-top:0}
.ddxrow b{color:#e9e3ff}
.decipher{margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(124,58,237,.14);border:1px solid rgba(167,139,250,.35)}
.decipher .blk-t{color:#d8ccff;margin-bottom:6px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;overflow:hidden;border-radius:10px;border:1px solid var(--line)}
table.t th{background:linear-gradient(90deg,#3a1222,#26163d);text-align:left;padding:10px 12px;font-size:12.5px;letter-spacing:.4px}
table.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}table.t tr:nth-child(even) td{background:rgba(255,255,255,.02)}
table.t td:first-child{font-weight:700;color:#fff}
.tw{overflow-x:auto}
/* figures */
.figs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fig{margin:0;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.fig img{width:100%;height:auto;max-height:520px;object-fit:contain;background:#000;cursor:zoom-in;display:block}
.fig figcaption{padding:10px 12px;font-size:13.5px;color:#cbd5e1;background:var(--panel);border-top:1px solid var(--line);flex:1}
.fig figcaption .src{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
.selftest .fig figcaption .cap,.selftest .casef .fv{filter:blur(6px);cursor:pointer;user-select:none}
.selftest .fig figcaption .cap.rv,.selftest .casef .fv.rv{filter:none}
.case h3{display:flex;align-items:center;gap:8px}
.casehd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.casehd>div{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.casehd .hh{padding:7px 12px;font-weight:800;font-size:13px}.casehd .cv .hh{background:#7f1230}.casehd .casef .hh{background:#16213a}
.casehd .bd{padding:8px 12px;font-size:14px}.casehd .bd div{margin:4px 0}.casehd .lbl{color:var(--acc2);font-weight:700;margin-right:6px}
.credit{font-size:12px;color:var(--mut);margin-top:8px}
.flow{position:relative;padding-left:26px}.flow:before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--acc),var(--violet))}
.fstep{position:relative;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.fstep:before{content:"";position:absolute;left:-21px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(244,63,94,.2)}
.fstep b{display:block;margin-bottom:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}.chk:first-of-type{border-top:0}
.chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid #3b4e6e;flex:none;margin-top:2px;display:grid;place-items:center;font-size:13px}
.chk.on .bx{background:var(--green);border-color:var(--green);color:#052e1f}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tri>div{padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center}
.tri .ic{width:40px;height:40px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin:0 auto 8px;color:#fff}
.tri b{display:block;color:var(--acc2)}
.donut{display:flex;gap:18px;align-items:center}.donut .d{width:110px;height:110px;border-radius:50%;flex:none;background:conic-gradient(var(--acc) 0 85%,var(--blue) 0);display:grid;place-items:center}
.donut .d i{width:66px;height:66px;border-radius:50%;background:var(--panel)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.duct{display:flex;align-items:center;gap:6px;margin:6px 0}.duct .a{height:14px;border-radius:7px;background:var(--blue);flex:3}.duct .s{width:18px;height:18px;border-radius:50%;background:var(--acc);flex:none}.duct .b{height:6px;border-radius:3px;background:var(--blue);flex:2}
.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.callc{border:2px solid var(--acc);border-radius:14px;padding:14px;background:rgba(244,63,94,.06)}
.callc h4{margin:0 0 8px;color:var(--acc2);font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:8px}.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:#cfeffc}
.links a:hover{border-color:var(--cyan)}
.focusnav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0 16px}
.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:9px;height:9px;border-radius:50%;background:#2a3a57;cursor:pointer}.dots i.on{background:var(--acc)}.dots i.seen{background:#6b3448}
.hidden{display:none!important}
/* quiz */
.qwrap{max-width:860px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qstem{font-size:18px;font-weight:650;line-height:1.5;margin:6px 0 14px}
.qimg{background:#000;border-radius:12px;border:1px solid var(--line);margin-bottom:14px;text-align:center}
.qimg img{max-width:100%;max-height:440px;cursor:zoom-in}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin:0 0 9px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:15px}
.opt:hover{border-color:#3a5482}.opt .L{width:26px;height:26px;border-radius:8px;background:#22314a;display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}
.opt.ok{border-color:var(--green);background:rgba(52,211,153,.12)}.opt.ok .L{background:var(--green);color:#052e1f}
.opt.no{border-color:var(--red);background:rgba(248,113,113,.12)}.opt.no .L{background:var(--red);color:#3b0a0a}
.opt.pick{border-color:var(--cyan)}
.expl{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-top:6px}
.expl .tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(124,58,237,.14);border:1px solid rgba(167,139,250,.35)}
.pbar{height:6px;border-radius:9px;background:#1d2a40;margin:4px 0 14px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--cyan)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.form select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}
.wkq{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.wkq .card{padding:14px;margin:0}
/* flashcards */
.fc{perspective:1200px;max-width:640px;margin:0 auto}
.fci{position:relative;height:290px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.fl .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid #33416a;display:grid;place-items:center;padding:26px;text-align:center;font-size:21px;font-weight:700}
.fcf{background:linear-gradient(135deg,#1a2440,#141c2d)}.fcb{background:linear-gradient(135deg,#2a1530,#1b1430);transform:rotateY(180deg);font-size:18px;font-weight:600}
/* drill */
.drillimg{background:#000;border-radius:14px;border:1px solid var(--line);text-align:center;margin-bottom:14px}.drillimg img{max-width:100%;max-height:480px}
/* atlas */
.atlas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.atlas .it{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.atlas img{width:100%;height:150px;object-fit:cover;display:block}.atlas .c{padding:6px 8px;font-size:12px;background:var(--panel);color:var(--mut)}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.on{display:flex}.lb img{max-width:96vw;max-height:80vh;transition:transform .2s;cursor:zoom-in}.lb img.z{transform:scale(1.9);cursor:zoom-out}
.lb .cap{max-width:900px;color:#d7dee9;margin-top:12px;text-align:center;font-size:14px}.lb .x{position:absolute;top:14px;right:16px;font-size:26px;background:none;border:0;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#1c2a44;border:1px solid #3a5482;padding:10px 16px;border-radius:12px;z-index:70;transition:.3s;font-weight:700}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);opacity:.45}.ach.on{opacity:1;border-color:rgba(251,191,36,.5)}
.ach .ai{width:34px;height:34px;border-radius:10px;background:#22314a;display:grid;place-items:center;font-size:18px}.ach.on .ai{background:rgba(251,191,36,.2)}
@media (max-width:980px){.side{transform:translateX(-100%);transition:transform .2s;width:290px;background:#0e1522}.side.on{transform:none}
.main{margin-left:0;padding:74px 14px 80px}.burger{display:block}.scrim.on{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.5);z-index:15}
.g3,.g4,.wkq{grid-template-columns:repeat(2,minmax(0,1fr))}.calls,.tri{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}
.chip.hide-s{display:none}.casehd{grid-template-columns:1fr}.ddxrow{grid-template-columns:1fr}.brand small{display:none}}
@media (max-width:560px){.g2,.g3,.g4,.wkq{grid-template-columns:1fr}.h1{font-size:24px}.chip.xp{display:none}.brand>div:last-child{display:none}.chip.hide-s{display:inline-flex}.top{gap:8px}}
@media print{.top,.side,.toolbar,.focusnav{display:none}.main{margin:0;padding:0}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="top"><button class="burger" id="burger" aria-label="Menu">☰</button>
<div class="brand" id="brand"><div class="logo">OP</div><div>Ottawa Prep for Call<small>Prep for Call · 23 Dec 2026</small></div></div>
<div class="topstats"><span class="chip cd hide-s" id="cd"></span><span class="chip xp" id="xp"></span><span class="chip st" id="stk"></span></div></header>
<nav class="side" id="side"></nav><div class="scrim" id="scrim"></div>
<main class="main" id="main"><div class="card">Loading Ottawa Prep for Call… If this message stays, the app files did not load — check that all 7 files are in the same folder of your repo.</div></main>
<div class="lb" id="lb"><button class="x" id="lbx" aria-label="Close">✕</button><img id="lbimg" alt=""><div class="cap" id="lbcap"></div><div class="small muted" style="margin-top:6px">Tap image to zoom · Esc or ✕ to close</div></div>
<div class="toast" id="toast"></div>
<script src="ottawa-data.js"></script>
<script src="ottawa-img1.js"></script>
<script src="ottawa-img2.js"></script>
<!-- Extension pack 1 (Spine · Abdo trauma · Pelvis · Contrast). Optional: if a file is missing the core app still runs. Add future packs here. -->
<script src="ottawa-ext1-data.js"></script>
<script src="ottawa-ext1-img1.js"></script>
<script src="ottawa-ext1-img2.js"></script>
<script src="ottawa-ext1-img3.js"></script>
<script src="ottawa-app.js"></script>
</body></html>
